<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — UCAS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css"> <!-- Link to the main stylesheet for consistent styling -->
  <style>
    /* Specific overrides for the 404 page layout using existing variables */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      /* Font and color are now inherited from style.css body defaults */
    }
    main {
      text-align: center;
      padding: var(--space-md); /* Use spacing variable */
    }
    h1 {
      font-size: var(--hero-h1); /* Use H1 variable from stylesheet */
      margin: 0 0 var(--space-sm); /* Use spacing variable */
      line-height: 1; /* Adjust line height for large display font */
      letter-spacing: -0.04em; /* Match h1 letter spacing */
    }
    p {
      font-size: var(--lead); /* Use lead paragraph style */
      color: var(--color-secondary); /* Use secondary color for paragraph */
      margin: 0; /* Remove default margin from <p> */
    }
    .btn-wrapper {
      margin-top: var(--space-lg); /* Use spacing variable for button margin */
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page doesn't exist.</p>
    <div class="btn-wrapper">
      <a href="/" class="btn btn--primary">Back to UCAS</a>
    </div>
  </main>
</body>
</html>
